name: payx

# Local stand-in for the production topology in the design doc. Grows one
# module at a time — see PROGRESS.md for which containers exist so far.
#
#   doc component                    -> container here
#   ---------------------------------------------------------------
#   "associated database" per service -> postgres (one database + one role each)
#   risk check state (velocity)       -> redis
#   card vault, risk decisions        -> localstack DynamoDB + KMS
#   PSP end-of-day settlement file    -> localstack S3
#   Kafka ("transaction completion")  -> kafka (single KRaft broker) + kafka-ui
#   load balancer / web servers       -> gateway (YARP)
#   payment service, card vault, PSP  -> payment, vault, psp-simulator
#
# Every service can be swapped for a Visual Studio debug session on the same
# port: docker compose stop <service>, then F5 that project. See DEBUGGING.md.

# What every PayX service container shares.
x-service-base: &service-base
  build: &service-build
    context: .
    dockerfile: infra/docker/Service.Dockerfile
  restart: unless-stopped
  # payx-host = this machine, as seen from inside a container (Docker
  # Desktop's host-gateway). Every call from one PayX service to another goes
  # through it, to the port the target publishes on the host. Whatever is
  # bound to that port answers: the target's container, or your debugger
  # after you stopped the container. Infrastructure (postgres, redis,
  # localstack) never moves, so it is reached directly by container name.
  extra_hosts:
    - "payx-host:host-gateway"
  environment: &service-env
    ASPNETCORE_ENVIRONMENT: Development
    ASPNETCORE_URLS: http://+:8080
    # Docker Desktop publishes an IPv4 and an IPv6 record for host aliases;
    # .NET tries IPv6 first, which has no route to the host, and every call
    # to payx-host fails with "Network is unreachable" (seen in SuggestX).
    DOTNET_SYSTEM_NET_DISABLEIPV6: "1"
    # Same token rules everywhere; Identity's discovery document via the host.
    Jwt__MetadataAddress: "http://payx-host:7081/.well-known/openid-configuration"

services:
  # ---------------------------------------------------------------- platform

  postgres:
    image: postgres:17-alpine
    container_name: payx-postgres
    environment:
      # Admin account: used only by the init script and by you in psql.
      # No service ever connects as this user — each gets its own role.
      POSTGRES_USER: payx_admin
      POSTGRES_PASSWORD: payx_admin
      POSTGRES_DB: payx_admin
    ports:
      # 5434, not 5432 — the sibling JameX stack already publishes 5432 on the
      # host. Container-to-container traffic still uses 5432.
      - "5434:5432"
    volumes:
      - payx-pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payx_admin -d payx_admin"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: payx-redis
    # noeviction, not allkeys-lru (SuggestX's choice): there Redis was a pure
    # cache and evicting a key just meant a miss. Here it will hold Risk's
    # velocity counters — silently evicting one would reset a card's
    # "payments in the last hour" to zero, which is a fraud hole. A full Redis
    # should fail loudly (writes rejected) so Risk's fallback kicks in.
    command: ["redis-server", "--maxmemory", "256mb", "--maxmemory-policy", "noeviction"]
    ports:
      # 6381 — JameX publishes 6379, SuggestX 6380.
      - "6381:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  localstack:
    image: localstack/localstack:latest
    container_name: payx-localstack
    environment:
      # sts: not used by PayX itself, but GUI tools (Dynobase, the AWS CLI's
      # profile checks) call sts:GetCallerIdentity to validate a profile
      # before anything else; without it they fall back to real AWS, which
      # rejects LocalStack's dummy "test" key.
      SERVICES: s3,dynamodb,kms,sts
      AWS_DEFAULT_REGION: us-east-1
      DEBUG: "0"
      # Personal token from the gitignored .env, same as the sibling projects.
      LOCALSTACK_AUTH_TOKEN: ${LOCALSTACK_AUTH_TOKEN:-}
    ports:
      # 4568 on the host — JameX publishes 4566, SuggestX 4567. Inside the
      # container (and to other containers) it is always 4566.
      - "4568:4566"
    volumes:
      - ./infra/localstack/init:/etc/localstack/init/ready.d:ro
    healthcheck:
      # Healthy only once the bootstrap script has finished: the KMS alias is
      # the last thing it creates.
      test: ["CMD-SHELL", "awslocal kms describe-key --key-id alias/payx-card-vault >/dev/null || exit 1"]
      interval: 6s
      timeout: 5s
      retries: 40
      start_period: 20s

  kafka:
    image: apache/kafka:4.1.0
    container_name: payx-kafka
    environment:
      # KRaft mode: Kafka stores its own cluster metadata — no ZooKeeper
      # (Kafka 4 removed it). This one process is both broker and controller.
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      # Two client listeners, because a client is told to reconnect to the
      # *advertised* address after its first contact:
      #   INTERNAL kafka:9092      — what other containers use
      #   EXTERNAL localhost:9094  — what your host (and VS debugger) uses
      # Advertise only one and the other side connects once, then fails.
      KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      # Single broker, so Kafka's own internal topics can't be replicated.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      # Topics are created deliberately (kafka-init below), never by a typo
      # in a producer's topic name.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    ports:
      - "9094:9094"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server kafka:9092 >/dev/null 2>&1"]
      interval: 6s
      timeout: 10s
      retries: 30
      start_period: 15s

  kafka-init:
    # One-shot: creates the topics, then exits. Services that need Kafka wait
    # for this to have *completed successfully*, not just for the broker.
    image: apache/kafka:4.1.0
    container_name: payx-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    volumes:
      - ./infra/kafka:/scripts:ro
    entrypoint: ["bash", "/scripts/create-topics.sh"]
    restart: "no"

  kafka-ui:
    image: ghcr.io/kafbat/kafka-ui:latest
    container_name: payx-kafka-ui
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_CLUSTERS_0_NAME: payx-local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    ports:
      - "7090:8080"

  # ---------------------------------------------------------------- services
  #
  # Each publishes the same port as its Visual Studio launch profile. The
  # environment variables override appsettings.json's localhost defaults with
  # container addresses (environment beats appsettings), so one appsettings
  # file serves both the container and the debugger.

  gateway:
    <<: *service-base
    container_name: payx-gateway
    build: { <<: *service-build, args: { SERVICE: Gateway } }
    ports:
      - "7080:8080"
    environment:
      <<: *service-env
      ReverseProxy__Clusters__payment__Destinations__payment-1__Address: "http://payx-host:7082/"
      ReverseProxy__Clusters__payment__Destinations__payment-2__Address: "http://payx-host:7092/"
      ReverseProxy__Clusters__identity__Destinations__identity-1__Address: "http://payx-host:7081/"
      ReverseProxy__Clusters__ledger__Destinations__ledger-1__Address: "http://payx-host:7085/"
      # Development only (appsettings.Development.json): the test console's card entry.
      ReverseProxy__Clusters__vault__Destinations__vault-1__Address: "http://payx-host:7084/"

  identity:
    <<: *service-base
    container_name: payx-identity
    build: { <<: *service-build, args: { SERVICE: Identity } }
    ports:
      - "7081:8080"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      <<: *service-env
      ConnectionStrings__Identity: "Host=postgres;Port=5432;Database=payx_identity;Username=payx_identity;Password=payx_identity_dev"
      # The same key file the debugger uses (App/.keys), so tokens issued by
      # either Identity keep verifying when you swap one for the other.
      Jwt__SigningKeyPath: "/keys/identity-signing-key.pem"
    volumes:
      - ./.keys:/keys

  payment:
    <<: *service-base
    container_name: payx-payment
    build: { <<: *service-build, args: { SERVICE: Payment } }
    ports:
      - "7082:8080"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      <<: *service-env
      ConnectionStrings__Payments: "Host=postgres;Port=5432;Database=payx_payments;Username=payx_payments;Password=payx_payments_dev"
      Vault__BaseUrl: "http://payx-host:7084/"
      Psp__BaseUrl: "http://payx-host:7088/"
      Risk__BaseUrl: "http://payx-host:7083/"
      Kafka__BootstrapServers: "kafka:9092"

  # Internal only (no Gateway route): Payment calls it before any money is
  # asked for (5.5). Redis holds its velocity counters (5.2).
  risk:
    <<: *service-base
    container_name: payx-risk
    build: { <<: *service-build, args: { SERVICE: Risk } }
    ports:
      - "7083:8080"
    depends_on:
      redis:
        condition: service_healthy
    environment:
      <<: *service-env
      ConnectionStrings__Redis: "redis:6379,abortConnect=false"

  vault:
    <<: *service-base
    container_name: payx-vault
    build: { <<: *service-build, args: { SERVICE: Vault } }
    ports:
      - "7084:8080"
    depends_on:
      redis:
        condition: service_healthy
      localstack:
        condition: service_healthy
    environment:
      <<: *service-env
      ConnectionStrings__Redis: "redis:6379,abortConnect=false"
      AWS__ServiceURL: "http://localstack:4566"
      Psp__BaseUrl: "http://payx-host:7088/"

  # The books (Phase 7): double-entry journal + balances in payx_ledger.
  ledger:
    <<: *service-base
    container_name: payx-ledger
    build: { <<: *service-build, args: { SERVICE: Ledger } }
    ports:
      - "7085:8080"
    depends_on:
      postgres:
        condition: service_healthy
      # Consumes payx.payments (7.3): the topics must exist first.
      kafka-init:
        condition: service_completed_successfully
    environment:
      <<: *service-env
      # Runtime as payx_ledger_app (SELECT/INSERT only); migrations as the owner (7.2).
      ConnectionStrings__Ledger: "Host=postgres;Port=5432;Database=payx_ledger;Username=payx_ledger_app;Password=payx_ledger_app_dev"
      ConnectionStrings__LedgerMigrations: "Host=postgres;Port=5432;Database=payx_ledger;Username=payx_ledger;Password=payx_ledger_dev"
      Kafka__BootstrapServers: "kafka:9092"

  psp-simulator:
    <<: *service-base
    container_name: payx-psp-simulator
    build: { <<: *service-build, args: { SERVICE: PspSimulator } }
    ports:
      - "7088:8080"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      <<: *service-env
      ConnectionStrings__Psp: "Host=postgres;Port=5432;Database=payx_psp;Username=payx_psp;Password=payx_psp_dev"

volumes:
  payx-pgdata:
