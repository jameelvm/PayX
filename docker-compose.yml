name: payx

# Local stand-in for the production topology in the design doc. Grows one
# module at a time — see PROGRESS.md for which containers exist so far.
#
#   doc component                    -> container here
#   ---------------------------------------------------------------
#   "associated database" per service -> postgres (one database + one role each)
#   risk check state (velocity)       -> redis
#   card vault, risk decisions        -> localstack DynamoDB + KMS
#   PSP end-of-day settlement file    -> localstack S3

services:
  # ---------------------------------------------------------------- platform

  postgres:
    image: postgres:17-alpine
    container_name: payx-postgres
    environment:
      # Admin account: used only by the init script and by you in psql.
      # No service ever connects as this user — each gets its own role.
      POSTGRES_USER: payx_admin
      POSTGRES_PASSWORD: payx_admin
      POSTGRES_DB: payx_admin
    ports:
      # 5434, not 5432 — the sibling JameX stack already publishes 5432 on the
      # host. Container-to-container traffic still uses 5432.
      - "5434:5432"
    volumes:
      - payx-pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payx_admin -d payx_admin"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: payx-redis
    # noeviction, not allkeys-lru (SuggestX's choice): there Redis was a pure
    # cache and evicting a key just meant a miss. Here it will hold Risk's
    # velocity counters — silently evicting one would reset a card's
    # "payments in the last hour" to zero, which is a fraud hole. A full Redis
    # should fail loudly (writes rejected) so Risk's fallback kicks in.
    command: ["redis-server", "--maxmemory", "256mb", "--maxmemory-policy", "noeviction"]
    ports:
      # 6381 — JameX publishes 6379, SuggestX 6380.
      - "6381:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  localstack:
    image: localstack/localstack:latest
    container_name: payx-localstack
    environment:
      SERVICES: s3,dynamodb,kms
      AWS_DEFAULT_REGION: us-east-1
      DEBUG: "0"
      # Personal token from the gitignored .env, same as the sibling projects.
      LOCALSTACK_AUTH_TOKEN: ${LOCALSTACK_AUTH_TOKEN:-}
    ports:
      # 4568 on the host — JameX publishes 4566, SuggestX 4567. Inside the
      # container (and to other containers) it is always 4566.
      - "4568:4566"
    volumes:
      - ./infra/localstack/init:/etc/localstack/init/ready.d:ro
    healthcheck:
      # Healthy only once the bootstrap script has finished: the KMS alias is
      # the last thing it creates.
      test: ["CMD-SHELL", "awslocal kms describe-key --key-id alias/payx-card-vault >/dev/null || exit 1"]
      interval: 6s
      timeout: 5s
      retries: 40
      start_period: 20s

volumes:
  payx-pgdata:
